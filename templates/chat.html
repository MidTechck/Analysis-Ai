<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analysis AI Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --bg: #05070a;
            --card: #111418;
            --border: #1e242c;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #2563eb;
            --success: #10b981;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }
        .chat-header {
            background: var(--card);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .chat-header h2 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
        }
        .back-btn { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back-btn:hover { color: var(--text); }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            padding-bottom: 130px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 14px;
            line-height: 1.55;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            animation: msg-in 0.3s ease;
        }
        @keyframes msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .message.user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .message.ai { align-self: flex-start; background: var(--card); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .input-wrapper {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 780px;
            background: var(--card); border: 1px solid var(--border); border-radius: 28px;
            padding: 8px 12px 8px 20px; display: flex; gap: 8px; align-items: flex-end;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000;
        }
        textarea {
            flex: 1; background: transparent; border: none; color: var(--text);
            font-family: inherit; font-size: 1rem; resize: none; outline: none;
            padding: 12px 0; max-height: 140px; min-height: 24px; line-height: 1.45;
        }
        .send-btn {
            background: var(--accent); color: white; border: none; border-radius: 50%;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; transition: background 0.2s, transform 0.1s;
        }
        .send-btn:hover { background: #1d4ed8; }
        .send-btn:active { transform: scale(0.94); }
        .send-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .state-bubble {
            align-self: flex-start;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            padding: 12px 16px;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .state-bubble.active { display: flex; }
        .mini-anim { width: 40px; height: 40px; position: relative; flex-shrink: 0; }

        .thinking-particles { width: 34px; height: 34px; position: relative; }
        .thinking-particles .dot {
            position: absolute; width: 2px; height: 2px;
            background: #a5b4fc; border-radius: 50%;
            opacity: 0.8; box-shadow: 0 0 4px #818cf8;
            animation: particle-float 2s ease-in-out infinite;
        }
        .thinking-particles .dot:nth-child(1) { top: 15%; left: 25%; }
        .thinking-particles .dot:nth-child(2) { top: 30%; left: 60%; animation-delay: 0.3s; }
        .thinking-particles .dot:nth-child(3) { top: 55%; left: 20%; animation-delay: 0.6s; }
        .thinking-particles .dot:nth-child(4) { top: 70%; left: 55%; animation-delay: 0.9s; }
        .thinking-particles .dot:nth-child(5) { top: 40%; left: 45%; animation-delay: 0.4s; }
        @keyframes particle-float {
            0%, 100% { transform: translate(0,0) scale(1); opacity: 0.5; }
            50% { transform: translate(3px,-4px) scale(1.3); opacity: 1; }
        }

        .search-orbit { width: 36px; height: 36px; position: relative; }
        .search-orbit .ring {
            position: absolute; border-radius: 50%;
            border: 1px solid rgba(165, 180, 252, 0.5);
            animation: orbit 2.4s linear infinite;
        }
        .search-orbit .ring:nth-child(1) { width: 100%; height: 100%; }
        .search-orbit .ring:nth-child(2) { width: 68%; height: 68%; top: 16%; left: 16%; animation-duration: 1.8s; animation-direction: reverse; }
        @keyframes orbit { to { transform: rotate(360deg); } }

        .done-mark {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1.5px solid rgba(16, 185, 129, 0.7);
            display: flex; align-items: center; justify-content: center;
            animation: pop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 8px rgba(16,185,129,0.3);
        }
        .done-mark svg { width: 14px; height: 14px; stroke: #34d399; fill: none; stroke-width: 2.5; stroke-linecap: round; }
        @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-header">
        <h2><span style="color: var(--success);">✦</span> Analysis AI</h2>
        <a href="/dashboard" class="back-btn">← Dashboard</a>
    </div>
    
    <div class="chat-container" id="chatBox">
        <div class="message ai" id="defaultGreeting">Hi! I'm Analysis AI. I have direct visibility into your system memory and email data. You can chat with me naturally, ask questions about recent analyses, or give me commands. How can I help?</div>
        <div class="state-bubble" id="stateBubble">
            <div class="mini-anim" id="miniAnim"></div>
            <span id="stateText">Thinking...</span>
        </div>
    </div>
    
    <div class="input-wrapper">
        <textarea id="userInput" placeholder="Ask a question or give a task..." rows="1" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
        <button class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const stateBubble = document.getElementById('stateBubble');
        const miniAnim = document.getElementById('miniAnim');
        const stateText = document.getElementById('stateText');
        const defaultGreeting = document.getElementById('defaultGreeting');

        const states = {
            thinking: { text: 'Thinking...', html: '<div class="thinking-particles"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>' },
            searching: { text: 'Checking inbox...', html: '<div class="search-orbit"><div class="ring"></div><div class="ring"></div></div>' },
            done: { text: 'Done', html: '<div class="done-mark"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>' }
        };

        function setState(key) {
            const s = states[key];
            miniAnim.innerHTML = s.html;
            stateText.textContent = s.text;
            stateBubble.classList.add('active');
        }

        function clearState() {
            stateBubble.classList.remove('active');
        }

        function isInboxQuery(text) {
            const t = text.toLowerCase();
            const keywords = ['check', 'how many', 'search', 'find', 'inbox', 'order', 'payment', 'confirmed', 'processed', 'count', 'list', 'emails', 'messages', 'compare', 'who', 'show', 'get'];
            return keywords.some(k => t.includes(k));
        }

        window.onload = async function() {
            try {
                const res = await fetch('/api/chat/history');
                const history = await res.json();
                if (history && history.length > 0) {
                    if (defaultGreeting) defaultGreeting.remove();
                    history.forEach(msg => {
                        const sender = msg.role === 'User' ? 'user' : 'ai';
                        addMessage(msg.text, sender);
                    });
                }
            } catch (err) {}
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if (defaultGreeting && defaultGreeting.parentNode) defaultGreeting.remove();

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            const needsSearch = isInboxQuery(text);
            let timers = [];

            if (needsSearch) {
                setState('searching');
                timers.push(setTimeout(() => setState('thinking'), 900));
            } else {
                setState('thinking');
            }

            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                timers.forEach(clearTimeout);
                setState('done');

                setTimeout(() => {
                    clearState();
                    if (data.reply) addMessage(data.reply, 'ai');
                    else addMessage("Error getting response from engine.", 'ai');
                }, 500);
            } catch (err) {
                timers.forEach(clearTimeout);
                clearState();
                addMessage("Connection failed. Please check your server.", 'ai');
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'message ' + sender;
            div.textContent = text;
            chatBox.insertBefore(div, stateBubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
